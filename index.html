<style>
:root{
  --sand:#fdf7ef; --sand2:#f6ead9; --card:#ffffff; --line:#e7d7c3;
  --ink:#2b1d13; --ink2:#6b5341; --ink3:#95806c;
  --rust:#b8410f; --rust2:#8c2f0b; --clay:#d97706; --river:#0e7490; --sage:#4d7c53;
  --shadow:0 1px 2px rgba(80,45,20,.06),0 6px 20px rgba(80,45,20,.08);
  --r:16px; --maxw:720px;
  --morning:#f59e0b; --afternoon:#0ea5e9; --evening:#7c3aed;
}
@media (prefers-color-scheme:dark){
  :root{
    --sand:#15100c; --sand2:#1e1712; --card:#221a14; --line:#3a2c22;
    --ink:#f5e9dc; --ink2:#c4ab95; --ink3:#93796; --ink3:#9a8271;
    --rust:#f97316; --rust2:#fb923c; --clay:#fbbf24; --river:#22d3ee; --sage:#86c58e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --sand:#15100c; --sand2:#1e1712; --card:#221a14; --line:#3a2c22;
  --ink:#f5e9dc; --ink2:#c4ab95; --ink3:#9a8271;
  --rust:#f97316; --rust2:#fb923c; --clay:#fbbf24; --river:#22d3ee; --sage:#86c58e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --sand:#fdf7ef; --sand2:#f6ead9; --card:#ffffff; --line:#e7d7c3;
  --ink:#2b1d13; --ink2:#6b5341; --ink3:#95806c;
  --rust:#b8410f; --rust2:#8c2f0b; --clay:#d97706; --river:#0e7490; --sage:#4d7c53;
  --shadow:0 1px 2px rgba(80,45,20,.06),0 6px 20px rgba(80,45,20,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sand); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Hebrew","Arial Hebrew",sans-serif;
  font-size:16px; line-height:1.55; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
a{color:var(--rust)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--sand);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;max-width:var(--maxw);margin:0 auto}
.brand .logo{width:30px;height:30px;flex:0 0 auto}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.brand h1 small{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:14px;font-weight:700;flex:0 0 auto
}
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;max-width:var(--maxw);margin:0 auto;
  scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:650;
  cursor:pointer;white-space:nowrap;transition:.15s
}
.tab[aria-selected="true"]{background:var(--rust);border-color:var(--rust);color:#fff}

main{max-width:var(--maxw);margin:0 auto;padding:14px 14px 60px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden
}
.card-pad{padding:14px}
.card h2{font-size:18px;font-weight:800}
.card h3{font-size:15.5px;font-weight:750}
.muted{color:var(--ink2);font-size:14px}
.tiny{color:var(--ink3);font-size:12.5px}

.banner{display:block;width:100%;height:auto;background:var(--sand2)}

.eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  margin-bottom:3px
}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.chip{
  font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;
  background:var(--sand2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap
}
.chip.hot{background:color-mix(in srgb,var(--rust) 12%,transparent);color:var(--rust);border-color:color-mix(in srgb,var(--rust) 30%,transparent)}
.chip.cool{background:color-mix(in srgb,var(--river) 12%,transparent);color:var(--river);border-color:color-mix(in srgb,var(--river) 30%,transparent)}

/* slot marker */
.slot{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.slot .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto}
.slot .lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.slot .tm{margin-inline-start:auto;font-size:13px;font-weight:800;color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:12px 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--sand2);color:var(--ink);font-size:14.5px;font-weight:700;
  cursor:pointer;text-decoration:none;margin-top:10px
}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{background:transparent}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:10px}

.linklist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.linklist a{
  font-size:12.5px;font-weight:650;text-decoration:none;color:var(--river);
  border:1px solid var(--line);background:var(--sand2);padding:5px 10px;border-radius:999px
}

/* ---------- gallery ---------- */
.gal{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal a{flex:0 0 auto;scroll-snap-align:start;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.gal img{display:block;width:230px;height:150px;object-fit:cover;background:var(--sand2)}
.credit{padding:0 14px 12px;font-size:11px;color:var(--ink3)}

/* ---------- video ---------- */
.vid{position:relative;margin:12px 14px 0;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#000}
.vid button{
  display:block;width:100%;padding:0;border:0;background:#000;cursor:pointer;position:relative;line-height:0
}
.vid img{width:100%;height:auto;display:block;opacity:.82}
.play{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none
}
.play span{
  width:56px;height:56px;border-radius:99px;background:rgba(0,0,0,.55);
  border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;
  color:#fff;font-size:19px;padding-inline-start:4px
}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.vidfall{display:block;padding:12px 14px;text-align:center;font-weight:700;color:var(--river);text-decoration:none}

/* ---------- tips ---------- */
.tips{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.tips li{
  display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.5;
  background:var(--sand2);border:1px solid var(--line);border-radius:12px;padding:9px 11px
}
.tips .who{flex:0 0 auto;font-size:15px;line-height:1.4}
.tips b{font-weight:750}
.tips li.warn{background:color-mix(in srgb,var(--rust) 9%,transparent);border-color:color-mix(in srgb,var(--rust) 28%,transparent)}
.tips.shots li{background:color-mix(in srgb,var(--river) 9%,transparent);border-color:color-mix(in srgb,var(--river) 26%,transparent)}

/* sun table */
.suntbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.suntbl th,.suntbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.suntbl th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.suntbl td.n{font-variant-numeric:tabular-nums;font-weight:700}
.suntbl tr:last-child td{border-bottom:0}
.scroller{overflow-x:auto}

/* collapsible stop cards */
details.item{padding:0}
details.item > summary{
  list-style:none;cursor:pointer;padding:13px 14px;display:block;
  -webkit-tap-highlight-color:transparent
}
details.item > summary::-webkit-details-marker{display:none}
details.item > summary::marker{content:''}
details.item > summary:focus-visible{outline:2px solid var(--rust);outline-offset:-2px;border-radius:var(--r)}
.sumrow{display:flex;align-items:center;gap:10px;margin-top:3px}
.sumrow h3{flex:1;min-width:0}
.chev{flex:0 0 auto;color:var(--ink3);transition:transform .18s ease}
details.item[open] .chev{transform:rotate(180deg)}
details.item[open] > summary{padding-bottom:4px}
.peek{
  font-size:13px;color:var(--ink3);margin:4px 0 0;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden
}
details.item[open] .peek{display:none}
/* weather */
.wx{display:grid;gap:7px}
.wxrow{
  display:flex;align-items:center;gap:8px;font-size:13.5px;
  padding:8px 10px;border-radius:11px;background:var(--sand2);border:1px solid var(--line)
}
.wxi{font-size:17px;flex:0 0 auto;line-height:1}
.wxp{font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxt{font-weight:800;flex:0 0 auto;white-space:nowrap}
.wxt i{font-style:normal;font-weight:600;color:var(--ink3)}
.wxr{flex:0 0 auto;color:var(--ink2);font-weight:700;white-space:nowrap;font-size:12.5px}
.wxr.wet{color:var(--rust)}
.wxc{flex:0 0 auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.wxc.hot{color:var(--rust);font-weight:800}
@media (max-width:400px){ .wxc{display:none} }

.dayctl{display:flex;gap:8px;padding:0 2px 12px}
.dayctl button{
  flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:13px;font-weight:700;cursor:pointer
}

/* ---------- food ---------- */
.food{margin:12px 0 0;display:grid;gap:8px}
.food .f{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--sand2)}
.food .f b{display:block;font-size:14.5px}
.food .f .m{font-size:12.5px;color:var(--ink2);margin-top:2px}
.food .f .a{font-size:12px;color:var(--ink3);margin-top:3px}
.food .f .arow{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.food .f .arow .a{margin-top:0;flex:1;min-width:0}
.fnav{
  flex:0 0 auto;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--river);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap
}
.fnav:active{background:var(--sand2)}

/* ---------- alerts ---------- */
.alert{
  border-radius:var(--r);padding:13px 14px;margin:0 0 14px;border:1px solid;
  font-size:14px;line-height:1.5
}
.alert b{display:block;font-size:14.5px;margin-bottom:3px}
.alert.red{background:color-mix(in srgb,#dc2626 10%,var(--card));border-color:color-mix(in srgb,#dc2626 35%,transparent)}
.alert.amber{background:color-mix(in srgb,var(--clay) 12%,var(--card));border-color:color-mix(in srgb,var(--clay) 38%,transparent)}
.alert.teal{background:color-mix(in srgb,var(--river) 10%,var(--card));border-color:color-mix(in srgb,var(--river) 32%,transparent)}

/* ---------- week grid ---------- */
.week{display:grid;gap:0}
.wrow{
  display:flex;gap:11px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start;cursor:pointer
}
.wrow:first-child{border-top:0}
.wrow .d{
  flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:var(--sand2);
  display:grid;place-items:center;line-height:1;border:1px solid var(--line)
}
.wrow .d b{font-size:16px;font-weight:800}
.wrow .d i{font-style:normal;font-size:10px;color:var(--ink3);font-weight:700}
.wrow .t{flex:1;min-width:0}
.wrow .t b{display:block;font-size:14.5px;font-weight:750}
.wrow .t span{display:block;font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .go{color:var(--ink3);font-size:16px}

/* ---------- boarding pass style ---------- */
.bp{padding:14px}
.bp .route{display:flex;align-items:center;gap:10px}
.bp .pt{text-align:center;flex:0 0 auto}
.bp .pt .code{font-size:24px;font-weight:850;letter-spacing:.02em}
.bp .pt .tm{font-size:19px;font-weight:800;margin-top:1px}
.bp .pt .dt{font-size:11.5px;color:var(--ink3);font-weight:650}
.bp .mid{flex:1;text-align:center;position:relative;padding:0 4px}
.bp .mid .ln{border-top:2px dashed var(--line);margin:12px 0 4px}
.bp .mid .dur{font-size:11.5px;color:var(--ink3);font-weight:700}
.bp .mid .pl{font-size:15px;color:var(--rust)}
.bp .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* live panel */
.live{display:flex;align-items:center;gap:9px;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--sand2);border:1px solid var(--line);font-size:13.5px}
.pulse{width:10px;height:10px;border-radius:99px;background:var(--ink3);flex:0 0 auto}
.pulse.on{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* boarding passes store */
.bpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bpitem{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--sand2);aspect-ratio:3/4}
.bpitem img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.bpitem .pdf{width:100%;height:100%;display:grid;place-items:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2);text-align:center;padding:6px}
.bpitem .del{
  position:absolute;inset-block-start:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:99px;
  border:0;background:rgba(0,0,0,.62);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center
}
.filelbl{display:block}
.filelbl input{display:none}

/* ---------- overlays ---------- */
.sheet{
  position:fixed;inset:0;z-index:80;background:rgba(20,10,4,.5);
  display:flex;align-items:flex-end;justify-content:center;padding:0
}
.sheet[hidden]{display:none}
.sheet .inner{
  background:var(--card);width:100%;max-width:var(--maxw);
  border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)
}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}

.viewer{position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer .vtop{display:flex;justify-content:flex-end;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#fff}
.viewer .vtop button{border:1px solid #ddd;background:#fff;color:#111;border-radius:11px;padding:8px 14px;font-weight:750;cursor:pointer}
.viewer .vbody{flex:1;overflow:auto;display:grid;place-items:center;background:#fff;padding:0 0 env(safe-area-inset-bottom)}
.viewer .vbody img{max-width:100%;height:auto;display:block}
.viewer .vbody iframe{width:100%;height:100%;border:0}

footer{max-width:var(--maxw);margin:0 auto;padding:6px 14px 34px;color:var(--ink3);font-size:11.5px;text-align:center}
</style>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#7c2d12"/>
      <path d="M0 30h48v18H0z" fill="#b8410f"/>
      <path d="M6 30l9-13 7 9 6-8 8 12z" fill="#f59e0b"/>
      <circle cx="35" cy="13" r="5" fill="#fde68a"/>
      <path d="M0 38c8 0 8 4 16 4s8-4 16-4 8 4 16 4v6H0z" fill="#0e7490"/>

    <h1><span id="appTitle">מסע במדבר</span><small id="appDates">21–25 AUG 2026</small></h1>
    <button class="iconbtn" id="langBtn" title="Language">EN</button>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="view"></main>
<footer id="foot"></footer>

<div class="sheet" id="navSheet" hidden>
  <div class="inner">
    <div class="grab"></div>
    <div class="eyebrow" id="navEyebrow"></div>
    <h2 id="navName" style="font-size:18px;font-weight:800"></h2>
    <p class="muted" id="navAddr" dir="ltr" style="margin:6px 0 0;text-align:start"></p>
    <a class="btn primary" id="navWaze" target="_blank" rel="noopener">Waze</a>
    <a class="btn" id="navGmaps" target="_blank" rel="noopener">Google Maps</a>

  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="vtop"><button id="viewerClose">✕</button></div>
  <div class="vbody" id="viewerBody"></div>
</div>

      shots:[

        {who:'itamar', text:T('<b>עדשה ארוכה, לא רחבה.</b> הטעות הקלאסית בגרנד קניון היא לצלם רחב — יוצא מרשים בעין וקטן בתמונה. 3x–5x בטלפון על צוק בודד או על שכבה אחת של מצוקים ייתן דחיסה ועומק. הרחב שמור לרגע שיש עננים דרמטיים למעלה.','<b>Long lens, not wide.</b> The classic Grand Canyon mistake is shooting wide — it looks vast to the eye and tiny in the photo. 3x–5x on your phone, aimed at a single butte or one layer of cliffs, gives compression and depth. Save the ultra-wide for when there’s dramatic cloud overhead.')},
        {who:'itamar', text:T('<b>עונת המונסון היא בעצם המזל שלכם.</b> אוגוסט הוא החודש עם הצילומים הדרמטיים ביותר בקניון: תאי סערה, קרני אור דרך העננים וקשתות. אם בונה סערה מעבר לקניון אחר הצהריים — זו התמונה של הטיול. רק לצלם אותה <b>מתוך הרכב או מתחת לגג</b>, לא מהמעקה.','<b>Monsoon season is actually your luck.</b> August is the most dramatic month at the canyon: storm cells, light shafts through cloud, rainbows. If a storm builds across the canyon in the afternoon, that’s the picture of the trip. Just take it <b>from the car or under a roof</b>, not from the railing.')}

        {who:'or', text:T('הנסיעה בטנדר היא ~20 דקות, חציה בערוץ חול — מטלטל, מאובק וחם, וזה החלק שילדים הכי מתלוננים עליו. באנדנה או מטפחת על הפנים עושה הבדל אמיתי. בתוך הקניון עצמו אין מדרגות ואין סולמות, זו הליכה קלה.','The truck ride is ~20 minutes, half of it up a sandy wash — bumpy, dusty and hot, and it’s the part kids complain about most. A bandana or buff over the face makes a real difference. Inside the canyon itself there are no stairs and no ladders; it’s an easy walk.')},
        {who:'all', text:T('<b>לחתום על הוויתור מראש</b> — כל ארבעתכם, מהלינק במייל של Peek. ולהגיע מוקדם: הם כותבים שאי-הגעה בזמן לצ׳ק-אין מבטלת את הסיור. 12:30 בחניון זה בטוח.','<b>Sign the waiver in advance</b> — all four of you, from the link in the Peek email. And arrive early: they state that failing to check in on time cancels your tour. 12:30 in the car park is safe.')},
        {who:'money', text:T('המדריכים חיים מטיפים. <b>20–40$ במזומן</b> למשפחה על סיור טוב, ישירות למדריך בסוף. אין כספומט בחניון — למשוך מראש בפייג׳.','Guides live on tips. <b>$20–40 cash</b> from the family for a good tour, straight to the guide at the end. There’s no ATM at the car park — withdraw in Page beforehand.')},
        {who:'all', warn:true, text:T('אם יש אזהרת שיטפון פתאומי, המדריכים מפנים את הקניון <b>גם בשמש מלאה</b> — הגשם שגורם לזה יורד 25 ק״מ משם. ביטול מצידם = החזר מלא או תיאום מחדש. זה לא זהירות יתר: ב-1997 נהרגו שם 11 מטיילים.','If there’s a flash-flood warning the guides evacuate the canyon <b>even in full sun</b> — the rain that causes it falls 25 km away. If they cancel you get a full refund or a reschedule. This isn’t over-caution: 11 hikers died there in 1997.')}
      ],
      shots:[
        {who:'itamar', text:T('<b>המדריכים הם הצלמים כאן.</b> מדריכי הנאוואחו באנטילופ עושים את זה עשרות פעמים ביום — הם ייקחו לכם את הטלפון, יכוונו אותו לתצורה הנכונה ויגידו לכם איפה לעמוד. תנו להם. הם גם יודעים בדיוק מתי הקרן נופלת ואיפה לזרוק חול לתוכה.','<b>The guides are the photographers here.</b> The Navajo guides do this dozens of times a day — they’ll take your phone, aim it at the right formation and tell you where to stand. Let them. They also know exactly when the beam lands and where to throw sand into it.')},
        {who:'itamar', warn:true, text:T('<b>אין חצובה, אז אין צילום ארוך.</b> להישען על דופן הקניון, לנשום החוצה וללחוץ. במצב לילה של הטלפון להיצמד לקיר לכל אורך החשיפה. ו<b>לנגב את העדשה לפני הכניסה ובאמצע</b> — האוויר שם מלא אבק דק והוא הורס יותר תמונות מכל דבר אחר.','<b>No tripod, so no long exposures.</b> Brace against the canyon wall, breathe out, then press. In phone night mode stay pressed to the wall for the whole exposure. And <b>wipe the lens before you go in and again halfway</b> — the air is full of fine dust and it ruins more shots there than anything else.')},
        {who:'tali', text:T('פורטרטים בתוך חריץ הם קשים — חושך וניגוד קיצוני. השילוב שעובד: אחד מכם ב<b>כתם האור</b> שנופל מלמעלה והשאר בצל, או צללית בפתח היציאה. המדריך יראה לכם את הנקודות האלה, פשוט לבקש.','Portraits inside a slot are hard — dark and extreme contrast. What works: one of you standing in the <b>pool of light</b> falling from above and the rest in shadow, or a silhouette at the exit. The guide will show you those spots — just ask.')}
      ]
    },
    { slot:'afternoon', time:'~15:30',

      desc:T('המים ~27°C, חמימים באמת. Lone Rock Beach הוא חוף חול אמיתי עם כניסה מדורגת למים, מקלחות חוץ ושירותים — 20 דקות מפייג׳, וכבר בגבול יוטה.','The water is ~27°C, genuinely warm. Lone Rock Beach is an actual sand beach with a gradual entry, outdoor showers and toilets — 20 minutes from Page, just over the Utah line.'),
      nav:'lonerock',
      nav2:'wahweap',
      navNote:T('ℹ️ <b>לון רוק</b> הוא חוף החול (זהירות מהחול הרך — ראו טיפ למטה). <b>Wahweap</b> הוא החלופה המסודרת: הכל אספלט, בלי סיכון לשקוע, אבל הליכה ארוכה יותר למים.','ℹ️ <b>Lone Rock</b> is the sand beach (mind the soft sand — see the tip below). <b>Wahweap</b> is the tidy alternative: all paved, no risk of burying the car, but a longer walk to the water.'),

      video:{id:'uWJkq5HzNhc', title:T('10 דברים לעשות באגם פאוול','Top 10 things to do at Lake Powell')},
      tips:[
        {who:'shai', text:T('<b>זה היום של שי.</b> אחרי שסליד רוק נסגר לעונה, זה מקום המים של הטיול — ופה הם חמים במקום 15°C.','<b>This is Shai’s day.</b> With Slide Rock closed for the season this is the trip’s water stop — and here it’s warm instead of 15°C.')},
        {who:'all', text:T('<b>ויש גם בריכה בדירה.</b> אחרי סיור ב-13:00 בחום ובאבק, יכול להיות שהתשובה הנכונה היא פשוט לחזור ליחידה 12 ולקפוץ לבריכה — בלי עוד 20 דקות נסיעה וחול. לון רוק שווה את זה אם יש כוח; אם לא, הבריכה מנצחת.','<b>And there’s a pool at the apartment.</b> After a 13:00 tour in the heat and dust, the right answer may simply be to go back to unit 12 and get in the pool — no further 20-minute drive and no sand. Lone Rock is worth it if you have the energy; if not, the pool wins.')},
        {who:'itamar', warn:true, text:T('<b>לא נוסעים עד קו המים.</b> אחרי שהאספלט נגמר החול נעשה עמוק ו-RAV4 שוקע — גוררים משם רכבים כל קיץ. עוצרים על הקרקע הקשיחה והולכים.','<b>Do not drive to the waterline.</b> Once the pavement ends the sand gets deep and a RAV4 will bury itself — they tow cars out of there every summer. Park on the firm ground and walk.')},
        {who:'or', warn:true, text:T('<b>חגורת ציפה חובה עד גיל 12</b> באגם פאוול, וזה נאכף. אין מצילים בשום מקום.','<b>A life jacket is mandatory up to age 12</b> at Lake Powell, and it’s enforced. There are no lifeguards anywhere.')},
        {who:'all', text:T('אפס צל בחוף — שמשייה או אוהל חוף זה לא מותרות. ואם שומעים רעם: יוצאים מהמים ולרכב. מים פתוחים וברק זה השילוב שהורג במונסון.','Zero shade on the beach — an umbrella or pop-up is not a luxury. And at the first thunder: out of the water and into the car. Open water plus lightning is the monsoon killer.')},
        {who:'all', text:T('חלופה בלי חול: אזור הרחצה המסומן ב-Wahweap — הכל אספלט, אבל הליכה ארוכה וחמה עד המים כי האגם נמוך מאוד השנה.','Sand-free alternative: the buoyed swim area at Wahweap — all paved, but a long hot walk to the water because the lake is very low this year.')}
      ],
      shots:[
        {who:'itamar', text:T('<b>שימו לב לשעון: השקיעה שמורה לפרסה.</b> לון רוק בשקיעה זה יפה, אבל אי אפשר לעשות את שתיהן — הפרסה מנצחת. כאן מצלמים באור אחר הצהריים: מים טורקיז, סלע אדום, ניגוד חזק. לצאת מהחוף ב-17:30.','<b>Watch the clock: sunset belongs to the Bend.</b> Lone Rock at sunset is lovely, but you cannot do both — the Bend wins. Shoot here in afternoon light instead: turquoise water, red rock, strong contrast. Leave the beach by 17:30.')},
        {who:'tali', text:T('הילדים במים עם הסלע מאחור זו התמונה שתרצו למסגר. לצלם <b>נמוך</b> — כפוף עד גובה המים — ככה הסלע נראה ענק והילדים לא נבלעים בחוף.','The kids in the water with the rock behind them is the one you will want framed. Shoot <b>low</b> — crouch to water level — that way the rock looks huge and the kids do not get swallowed by the beach.')}

      food:[
        {n:'Dam Bar & Grille', m:T('🥩 <b>הבחירה הבטוחה הערב.</b> אחרי הפרסה תחזרו לעיר בערך ב-19:45, וזה <b>המטבח היחיד שפתוח עד 23:00</b>. שאר העיר סוגרת מטבח ב-21:00, והצפיפות היא 18:00–19:45 — בדיוק כשאתם על הצוק.','🥩 <b>The safe choice tonight.</b> After the Bend you will be back in town around 19:45, and this is <b>the only kitchen open until 23:00</b>. The rest of town shuts its kitchen at 21:00, and the crush is 18:00–19:45 — exactly when you are on the cliff.'), a:'644 N Navajo Dr', nav:'644 N Navajo Dr, Page, AZ 86040'},
        {n:'Sunset 89', m:T('🥗 הכי קליל ומוקפד בעיר, נוף לכיוון האגם. סוגר ב-21:00 — עובד רק אם מזמינים שולחן ל-20:00 ומגיעים בזמן.','🥗 The lightest and most refined in town, with a view toward the lake. Closes 21:00 — only works if you book a table for 20:00 and actually make it.'), a:'724 US-89 · 928-608-5562', nav:'724 US-89, Page, AZ 86040'},

    { slot:'evening', time:'18:00',
      title:T('Horseshoe Bend — בשעה הזהובה','Horseshoe Bend — at golden hour'),
      desc:T('2.4 ק״מ הלוך-חזור על שביל מהודק, עם עלייה קטנה בדרך חזרה. <b>זה הזמן הנכון לבוא.</b> השמש הנמוכה במערב מאירה את דופן הפרסה — בבוקר הגורג׳ עמוק בצל ובדיוק מה שבאתם בשבילו יוצא שחור. ומבחינת חום זה כמעט אותו דבר: 30.6° ב-18:00 מול 27.5° ב-06:00.','2.4 km round trip on a hardened path, with a small climb on the way back. <b>This is the right time to come.</b> The low western sun lights the wall of the bend — in the morning the gorge is in deep shadow and the very thing you came for goes black. And heat-wise it’s nearly a wash: 30.6° at 18:00 against 27.5° at 06:00.'),
      nav:'horseshoe',
      chips:[T('10$ לרכב','$10 per car'), T('45–75 דק׳','45–75 min'), T('שקיעה 19:06','Sunset 19:06'), T('אין צל בתצפית','No shade at the overlook')],
      photos:[
        P('Horseshoe_Bend_Arizona_dllu.jpg','Horseshoe_Bend_Arizona_dllu.jpg',T('נהר הקולורדו מקיף את סלע החול בפרסה','The Colorado River curving around the sandstone butte')),
        P('USA_10187_Horseshoe_Bend_Luca_Galuzzi_2007.jpg','USA_10187_Horseshoe_Bend_Luca_Galuzzi_2007.jpg',T('Horseshoe Bend מנקודת התצפית','Horseshoe Bend from the clifftop overlook')),

      video:{id:'6UA1iEy_j04', title:T('מדריך להליכה ל-Horseshoe Bend','Horseshoe Bend hike guide')},
      tips:[
        {who:'money', text:T('<b>הפאס של הפארקים לא תקף כאן</b> — החניון שייך לעיריית פייג׳, 10$ במזומן או בכרטיס. לא לחנות על כביש 89: גוררים.','<b>The parks pass does not work here</b> — the car park belongs to the City of Page, $10 cash or card. Don’t park on US-89: they tow.')},
        {who:'or', warn:true, text:T('<b>רוב שפת הצוק כאן לא מגודרת ויש 300 מטר נפילה.</b> יש קטע אחד עם מעקה — נשארים שם. ובדרך חזרה זו העלייה, אז שומרים לו מים וחטיף לסוף.','<b>Most of the rim here is unfenced with a 300 m drop.</b> There is one railed section — stay on it. And the return leg is the uphill one, so save water and a snack for the end.')},
        {who:'all', text:T('אין מים ואין חנות בשביל — רק שירותים בחניון. ליטר לאדם מינימום, גם להליכה של שעה.','No water and no shop on the trail — only restrooms at the car park. One litre per person minimum, even for a one-hour walk.')},
        {who:'all', warn:true, text:T('<b>השער מפסיק להכניס בשקיעה — 19:06.</b> להיות בחניון עד 18:15 לכל המאוחר. מותר להישאר ולסיים אחרי השקיעה, אבל לא להיכנס. וקחו פנס או פנס-טלפון: החזרה לחניון תהיה בדמדומים.','<b>The gate stops admitting at sunset — 19:06.</b> Be in the car park by 18:15 at the latest. You may stay and finish after sunset, but you can’t enter. And bring a torch or use your phone: the walk back will be in dusk.')},
        {who:'all', text:T('<b>שקיעה זו השעה הכי עמוסה כאן.</b> זה המחיר של האור הטוב — ב-06:30 החניון היה ריק. אם החניון מלא, לא לחנות על כביש 89 בשום מצב: גוררים.','<b>Sunset is the busiest hour here.</b> That’s the price of the good light — at 06:30 the car park would have been empty. If it’s full, do not park on US-89 under any circumstances: they tow.')}
      ],
      shots:[
        {who:'itamar', text:T('<b>השעה הזהובה כאן היא 18:34–19:06.</b> להגיע ב-18:00 נותן זמן ללכת את הקילומטר ולהתמקם לפני שהאור הטוב מתחיל. אל תעזבו ברגע שהשמש נעלמת — עשר הדקות שאחרי השקיעה נותנות את השמיים הוורודים מעל הסלע האדום.','<b>Golden hour here is 18:34–19:06.</b> Arriving at 18:00 gives you time to walk the kilometre and get set before the good light starts. Don’t leave the moment the sun goes — the ten minutes after sunset give you pink sky over red rock.')},
        {who:'itamar', text:T('צריך <b>אולטרה-רחב</b> (0.5x בטלפון) כדי להכניס את כל הפרסה — בעדשה רגילה זה פשוט לא נכנס. ולצלם מ<b>עמידה מאחורי המעקה</b>: כל שנה נהרגים שם אנשים שנסוגו צעד אחורה כדי ״להכניס הכל״.','You need the <b>ultra-wide</b> (0.5x on a phone) to fit the whole bend in — a normal lens simply won’t hold it. And shoot from <b>behind the railing</b>: people die there every year stepping back to “fit it all in”.')},
        {who:'tali', text:T('התמונה המשפחתית הטובה כאן היא <b>מהצד</b>, עם הפרסה מאחור ולא מתחת — ככה רואים גם אתכם וגם למה באתם. בערב השמש נמוכה ממול, אז לצלם <b>קצת מהצד</b> ולא ישירות נגדה, אחרת תצאו צלליות. או — לאמץ את זה ולעשות צללית מכוונת של ארבעתכם על רקע השמיים.','The good family shot here is <b>from the side</b>, with the bend behind you rather than below you — that way both you and the reason you came are visible. In the evening the sun is low and in front of you, so shoot <b>slightly off-axis</b> rather than straight into it, or you’ll all come out as silhouettes. Or lean into it and do a deliberate silhouette of the four of you against the sky.')}
      ]
    }

function applyLang(){

function applyTheme(){

  if(!key) return '';
  const n = NAV[key]; if(!n) return '';
  return `<button class="btn ${secondary?'':'primary'}" data-nav="${key}">🧭 ${esc(tx(UI.navTo))} ${esc(tx(n.name))}</button>`;
}

function galleryHTML(photos){
  if(!photos || !photos.length) return '';
  const imgs = photos.map(p=>`<a href="${p.page}" target="_blank" rel="noopener"><img loading="lazy" src="${p.src}" alt="${esc(tx(p.alt))}"></a>`).join('');
  return `<div class="gal">${imgs}</div><div class="credit">${esc(tx(UI.photoCred))}</div>`;
}

  return `<div class="vid" data-vid="${v.id}">

function tipsHTML(tips){

  const li = tips.map(t=>{
    const p = PEOPLE[t.who] || PEOPLE.all;
    return `<li class="${t.warn?'warn':''}"><span class="who">${p.emoji}</span><span><b>${esc(tx(p.name))}:</b> ${tx(t.text)}</span></li>`;
  }).join('');
  return `<div class="eyebrow" style="margin-top:14px">${esc(tx(UI.tips))}</div><ul class="tips">${li}</ul>`;

function shotsHTML(shots){
  if(!shots || !shots.length) return '';
  const li = shots.map(s=>{
    const p = PEOPLE[s.who] || PEOPLE.all;
    return `<li><span class="who">${p.emoji}</span><span><b>${esc(tx(p.name))}:</b> ${tx(s.text)}</span></li>`;
  }).join('');
  return `<div class="eyebrow" style="margin-top:14px">📸 ${esc(tx(UI.shots))}</div><ul class="tips shots">${li}</ul>`;

function foodHTML(food){
  if(!food || !food.length) return '';
  const f = food.map(x=>{
    // Small inline pill — deliberately not the big primary button, so a
    // restaurant is never mistaken for a scheduled stop.
    const pill = x.nav
      ? `<button class="fnav" data-navaddr="${esc(x.nav)}" data-navname="${esc(x.n)}">🧭 ${esc(tx(UI.navShort))}</button>`
      : '';
    return `<div class="f">
      <b>${esc(x.n)}</b>
      <div class="m">${tx(x.m)}</div>
      <div class="arow"><span class="a"><bdi>${esc(x.a)}</bdi></span>${pill}</div>
    </div>`;
  }).join('');
  return `<div class="eyebrow" style="margin-top:14px">${esc(tx(UI.food))}</div><div class="food">${f}</div>`;
}

function linksHTML(links){
  if(!links || !links.length) return '';
  return `<div class="linklist">${links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${esc(tx(l.l))} ↗</a>`).join('')}</div>`;
}

function chipsHTML(chips, cls){
  if(!chips || !chips.length) return '';
  return `<div class="chips">${chips.map(c=>`<span class="chip ${cls||''}">${esc(tx(c))}</span>`).join('')}</div>`;

/* ---------- weather ----------
   One batched Open-Meteo request covers every spot (keyless, CORS-open).
   Cached in localStorage so the cards still work with no signal in the canyons.
   `norm` is the August climate normal, used when there's no cache and no network. */
const SPOTS = {
  flagstaff:{lat:35.1981, lon:-111.6513, name:T('פלגסטאף','Flagstaff'),          norm:[28,12]},
  canyon:   {lat:36.0589, lon:-112.1092, name:T('גרנד קניון','Grand Canyon'),    norm:[28,12]},
  page:     {lat:36.9147, lon:-111.4558, name:T('פייג׳','Page'),                 norm:[36,23]},
  barstow:  {lat:34.8958, lon:-117.0173, name:T('ברסטו / מוהאבי','Barstow / Mojave'), norm:[39,23]},
  seligman: {lat:35.3258, lon:-112.8746, name:T('סליגמן','Seligman'),            norm:[32,16]},
  mdr:      {lat:33.9822, lon:-118.4602, name:T('מרינה דל ריי','Marina del Rey'),norm:[24,18]}
};
const SPOT_KEYS = Object.keys(SPOTS);
const DAY_DATE  = {'day-1':'2026-08-21','day-2':'2026-08-22','day-3':'2026-08-23','day-4':'2026-08-24','day-5':'2026-08-25'};
const DAY_SPOTS = {
  'day-1':['barstow','flagstaff'],
  'day-2':['canyon','page'],
  'day-3':['page'],
  'day-4':['seligman','mdr'],
  'day-5':['mdr']
};

// WMO weather codes → icon + label
function wxCode(c){
  if(c===0)                return {i:'☀️', t:T('בהיר','Clear')};
  if(c===1||c===2)         return {i:'🌤️', t:T('בהיר חלקית','Partly cloudy')};
  if(c===3)                return {i:'☁️', t:T('מעונן','Overcast')};
  if(c===45||c===48)       return {i:'🌫️', t:T('ערפל','Fog')};
  if(c>=51&&c<=57)         return {i:'🌦️', t:T('טפטוף','Drizzle')};
  if(c>=61&&c<=67)         return {i:'🌧️', t:T('גשם','Rain')};
  if(c>=71&&c<=77)         return {i:'🌨️', t:T('שלג','Snow')};
  if(c>=80&&c<=82)         return {i:'🌦️', t:T('ממטרים','Showers')};
  if(c>=95)                return {i:'⛈️', t:T('סופת רעמים','Thunderstorms')};
  return {i:'🌡️', t:T('—','—')};
}

const WX_KEY = 'wx-v1';
let WX = null;
try{ WX = JSON.parse(localStorage.getItem(WX_KEY) || 'null'); }catch(e){ WX = null; }

async function fetchWeather(){
  const lats = SPOT_KEYS.map(k=>SPOTS[k].lat).join(',');
  const lons = SPOT_KEYS.map(k=>SPOTS[k].lon).join(',');
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lats+'&longitude='+lons
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code'
    + '&timezone=America%2FPhoenix&start_date=2026-08-21&end_date=2026-08-25';
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('wx ' + r.status);
  let j = await r.json();
  if(!Array.isArray(j)) j = [j];          // single-location responses aren't wrapped
  const out = {};
  SPOT_KEYS.forEach((k,idx)=>{
    const d = j[idx] && j[idx].daily;
    if(!d) return;
    out[k] = {};
    d.time.forEach((date,i)=>{
      out[k][date] = {mx:d.temperature_2m_max[i], mn:d.temperature_2m_min[i],
                      pp:d.precipitation_probability_max[i], c:d.weather_code[i]};
    });
  });
  WX = {at: Date.now(), data: out};
  try{ localStorage.setItem(WX_KEY, JSON.stringify(WX)); }catch(e){}
  return WX;
}

function wxRows(dayId){
  const date = DAY_DATE[dayId];
  const keys = DAY_SPOTS[dayId] || [];
  return keys.map(k=>{
    const sp = SPOTS[k];
    const live = WX && WX.data && WX.data[k] && WX.data[k][date];
    if(live && live.mx != null){
      const w = wxCode(live.c);
      const hot = live.mx >= 35, wet = live.pp >= 40;
      return `<div class="wxrow">
        <span class="wxi">${w.i}</span>
        <span class="wxp">${esc(tx(sp.name))}</span>
        <span class="wxt num"><bdi>${Math.round(live.mx)}° <i>/ ${Math.round(live.mn)}°</i></bdi></span>
        <span class="wxr num ${wet?'wet':''}">☔ ${live.pp==null?'—':live.pp+'%'}</span>
        <span class="wxc ${hot?'hot':''}">${esc(tx(w.t))}</span>
      </div>`;
    }
    return `<div class="wxrow">
      <span class="wxi">🌡️</span>
      <span class="wxp">${esc(tx(sp.name))}</span>
      <span class="wxt num"><bdi>${sp.norm[0]}° <i>/ ${sp.norm[1]}°</i></bdi></span>
      <span class="wxr">—</span>
      <span class="wxc">${LANG==='h'?'ממוצע אוגוסט':'August average'}</span>
    </div>`;
  }).join('');
}

function wxCardHTML(dayId){
  if(!DAY_SPOTS[dayId]) return '';
  const date = DAY_DATE[dayId];
  const keys = DAY_SPOTS[dayId];
  const anyWet = keys.some(k=>{
    const d = WX && WX.data && WX.data[k] && WX.data[k][date];
    return d && d.pp >= 40;
  });
  const stale = WX ? '' : (LANG==='h' ? 'ממוצעים רב-שנתיים — לא הצלחנו לטעון תחזית' : 'Climate averages — forecast could not be loaded');
  return `<div class="card" id="wxCard">
    <div class="card-pad">
      <div class="eyebrow">${LANG==='h'?'מזג אוויר':'Weather'}</div>
      <div class="wx">${wxRows(dayId)}</div>
      ${anyWet ? `<p class="tiny" style="margin-top:10px;color:var(--rust)">${LANG==='h'

    </div>

}

/* ============================================================
   ROUTER
   ============================================================ */
function tabsList(){
  return [
    {id:'home',   label:UI.home},
    {id:'flights',label:UI.flights},
    {id:'car',    label:UI.car},
    ...DAYS.map(d=>({id:d.id, label:d.tab})),
    {id:'photo',  label:UI.photo},
    {id:'backup', label:UI.backup}
  ];
}

function renderTabs(active){
  const el = document.getElementById('tabs');
  el.innerHTML = tabsList().map(t=>
    `<button class="tab" role="tab" data-goto="${t.id}" aria-selected="${t.id===active}">${esc(tx(t.label))}</button>`
  ).join('');
  const cur = el.querySelector('[aria-selected="true"]');
  if(cur) cur.scrollIntoView({block:'nearest', inline:'center'});
}

function render(){
  const id = (location.hash||'#home').slice(1);
  const known = tabsList().some(t=>t.id===id) ? id : 'home';
  renderTabs(known);
  const v = document.getElementById('view');
  if(known==='home')        v.innerHTML = viewHome();
  else if(known==='flights')v.innerHTML = viewFlights(), initFlights();
  else if(known==='car')    v.innerHTML = viewCar();
  else if(known==='photo')  v.innerHTML = viewPhoto();
  else if(known==='backup') v.innerHTML = viewBackup();
  else                    { v.innerHTML = viewDay(DAYS.find(d=>d.id===known)); ensureWeather(known); }
  document.getElementById('foot').textContent = LANG==='h'
    ? 'נבנה במיוחד לטיול הזה · ' + (new Date().getFullYear())
    : 'Built for this trip · ' + (new Date().getFullYear());
  window.scrollTo(0,0);
}

/* image + video fallbacks (capture phase) */
document.addEventListener('error', e=>{
  const t = e.target;
  if(t.tagName !== 'IMG') return;
  if(t.closest('.gal')){
    const a = t.closest('a'); const gal = t.closest('.gal');
    if(a) a.remove();
    if(gal && !gal.querySelector('img')){
      const cred = gal.nextElementSibling;
      if(cred && cred.classList.contains('credit')) cred.remove();
      gal.remove();
    }
  } else if(t.closest('.vid')){
    const box = t.closest('.vid'); const id = box.dataset.vid;
    box.innerHTML = `<a class="vidfall" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">${esc(tx(UI.openYt))} ↗</a>`;
  }
}, true);

/* Refresh the forecast at most every 3 hours; failures fall back to the
   cached values, and then to the August normals. Never blocks rendering. */
let wxPending = false;
async function ensureWeather(dayId){
  const fresh = WX && (Date.now() - WX.at) < 3*3600*1000;
  if(fresh || wxPending) return;
  wxPending = true;
  try{
    await fetchWeather();
    const cur = (location.hash||'#home').slice(1);
    if(cur === dayId){
      const el = document.getElementById('wxCard');
      if(el) el.outerHTML = wxCardHTML(dayId);
    }
  }catch(e){ /* offline or blocked — cached/normals already shown */ }
  finally{ wxPending = false; }
}

/* ============================================================
   LIVE FLIGHT POSITION
   ============================================================ */
let liveTimer = null;
function initFlights(){
  renderPasses();
  const input = document.getElementById('bpInput');
  if(input) input.addEventListener('change', onPassFiles);
  pollLive();
  clearInterval(liveTimer);
  liveTimer = setInterval(pollLive, 120000);
}
async function pollLive(){
  document.querySelectorAll('[data-live]').forEach(async el=>{
    const cs = el.dataset.live;
    const dot = el.querySelector('.pulse'), txt = el.querySelector('.txt');
    try{
      const r = await fetch('https://api.airplanes.live/v2/callsign/'+cs, {cache:'no-store'});
      const j = await r.json();
      const ac = (j && j.ac && j.ac[0]) || null;
      if(ac && (ac.alt_baro || ac.gs)){
        const alt = typeof ac.alt_baro === 'number' ? Math.round(ac.alt_baro).toLocaleString() + ' ft' : '—';
        const spd = ac.gs ? Math.round(ac.gs) + ' kt' : '—';
        dot.className = 'pulse on';
        txt.innerHTML = `<b>${cs} ${esc(tx(UI.liveYes))}</b> · <span class="num">${alt}</span> · <span class="num">${spd}</span>`;
      } else {
        // The request succeeded, the aircraft simply isn't in the air.
        dot.className = 'pulse';
        txt.textContent = cs + ' — ' + tx(UI.liveNo);
      }
    }catch(err){
      // Feed unreachable (blocked, offline, or the API started requiring a key).
      // Say so plainly instead of implying the plane isn't flying.
      dot.className = 'pulse';
      txt.textContent = tx(UI.liveOff);
    }
  });
}

/* ============================================================
   BOARDING PASSES (IndexedDB, local only)
   ============================================================ */
const DB='trip-bp', STORE='passes';
function db(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); };
    r.onsuccess = ()=>res(r.result);
    r.onerror  = ()=>rej(r.error);
  });
}
async function allPasses(){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(STORE,'readonly').objectStore(STORE).getAll();
    t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error);
  });
}
async function addPass(rec){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(STORE,'readwrite').objectStore(STORE).add(rec);
    t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);
  });
}
async function delPass(id){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
    t.onsuccess=()=>res(); t.onerror=()=>rej(t.error);
  });
}
async function onPassFiles(e){
  const files = [...e.target.files];
  for(const f of files){
    const buf = await f.arrayBuffer();
    await addPass({name:f.name, type:f.type, blob:new Blob([buf],{type:f.type})});
  }
  e.target.value = '';
  renderPasses();
}
async function renderPasses(){
  const grid = document.getElementById('bpGrid');
  if(!grid) return;
  let items = [];
  try{ items = await allPasses(); }catch(err){ grid.innerHTML = `<p class="tiny">${esc(tx(UI.bpEmpty))}</p>`; return; }
  if(!items.length){ grid.innerHTML = `<p class="tiny" style="margin-top:10px">${esc(tx(UI.bpEmpty))}</p>`; return; }
  grid.className = 'bpgrid';
  grid.innerHTML = '';
  items.forEach(it=>{
    const url = URL.createObjectURL(it.blob);
    const cell = document.createElement('div');
    cell.className = 'bpitem';
    if(it.type && it.type.startsWith('image/')){
      const img = document.createElement('img');
      img.src = url; img.alt = it.name;
      img.addEventListener('click', ()=>{
        viewerBody.innerHTML = '';
        const big = document.createElement('img'); big.src = url; big.alt = it.name;
        viewerBody.appendChild(big); viewer.hidden = false;
      });
      cell.appendChild(img);
    } else {
      const p = document.createElement('div');
      p.className = 'pdf'; p.textContent = '📄 ' + it.name;
      p.addEventListener('click', ()=>{
        viewerBody.innerHTML = '';
        const fr = document.createElement('iframe'); fr.src = url;
        viewerBody.appendChild(fr); viewer.hidden = false;
      });
      cell.appendChild(p);
    }
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕';
    del.addEventListener('click', async ()=>{
      if(confirm(tx(UI.bpDel))){ await delPass(it.id); renderPasses(); }
    });
    cell.appendChild(del);
    grid.appendChild(cell);
  });
}

applyLang(); applyTheme();
window.addEventListener('hashchange', render);
render();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  try{ navigator.serviceWorker.register('./sw.js'); }catch(e){}
}
